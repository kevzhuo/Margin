[package]
name = "margin"
version = "0.1.0"
description = "A local Markdown editor with Typora-style live preview and an Apple/Notion look."
authors = ["Kevin Zhuo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "margin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` serves vault images to the webview (app.security.assetProtocol).
# `macos-private-api` backs the transparent window and sidebar vibrancy on macOS;
# it is inert elsewhere. tauri-build requires these features to match
# tauri.conf.json, and it only reads this entry, so both live here.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
trash = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
